---
# MegaLinter v9 configuration.
# https://megalinter.io/latest/configuration/
#
# The repository has dedicated blocking workflows for Markdown, links,
# GitHub Actions, pre-commit, secrets, and vulnerability scanning. MegaLinter
# complements those gates with a small, deterministic changed-file baseline.
APPLY_FIXES: none
VALIDATE_ALL_CODEBASE: false
ENABLE_LINTERS:
  - JSON_JSONLINT
  - JSON_V8R
  - PYTHON_MYPY
  - YAML_YAMLLINT

REPORT_OUTPUT_FOLDER: megalinter-reports
PARALLEL: true
